<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 100px 20px; color: #333; }
        h1 { font-size: 5rem; margin-bottom: 20px; color: #e74c3c; }
        p { font-size: 1.2rem; margin: 20px 0; }
        .btn { display: inline-block; background: #3498db; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; margin-top: 30px; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>页面未找到</h2>
    <p>您访问的页面不存在或已被移动</p>
    <a href="/" class="btn">返回主页</a>
</body>
</html>
