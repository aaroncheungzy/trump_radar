name: 新闻监控与分析任务

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'

jobs:
  run-task:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      
      # 新增：缓存历史记录文件
      - name: 加载历史记录缓存
        uses: actions/cache@v3
        with:
          path: processed_articles.json  # 缓存历史记录文件
          key: processed-articles-${{ github.sha }}
          restore-keys: |
            processed-articles-
      
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 配置代理（可选）
        run: |
          if [ -n "${{ secrets.HTTP_PROXY }}" ]; then
            echo "HTTP_PROXY=${{ secrets.HTTP_PROXY }}" >> $GITHUB_ENV
            echo "HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}" >> $GITHUB_ENV
          fi
      
      - name: 执行任务
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python news_monitor.py
      
      - name: 提交静态报告更新
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add docs/  # 添加所有静态文件变更
          git commit -m "Auto-update reports: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "Push failed (no changes)"
      
      - name: 上传日志和历史记录
        uses: actions/upload-artifact@v4
        with:
          name: task-data
          path: |
            news_monitor.log
            debug_raw_html.html
            processed_articles.json
        if: always()
